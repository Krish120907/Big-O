<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Big-O</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" crossorigin>
    <link rel="stylesheet" href="assets/css/tailwind.min.css">
    <link rel="stylesheet" href="assets/css/styles.css?v=14">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              lc: {
                bg: '#1a1a1a',
                surface: '#282828',
                elevated: '#323232',
                hover: '#373737',
                border: 'rgba(255, 255, 255, 0.08)',
                brand: '#ffa116',
                easy: '#00b8a3',
                medium: '#ffc01e',
                hard: '#ff375f',
                submit: '#2cbb5d'
              }
            }
          }
        }
      }
    </script>
    <script>
      window.__ENV__ = {
        API_BASE_URL: "http://localhost:8080/api"
      };
    </script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/auth.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-[#1a1a1a] text-[#eff1f6] min-h-screen flex flex-col font-sans transition-colors duration-150" x-data="contactApp()" x-init="init()">

    <!-- Top LeetCode Navigation Bar -->
    <nav class="lc-navbar">
        <div class="lc-navbar-inner">
            <!-- Left: Logo & Nav Links -->
            <div class="flex items-center space-x-6">
                <a href="index.html" class="lc-brand">
                    <div class="lc-brand-icon">
                        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="16 18 22 12 16 6"></polyline>
                            <polyline points="8 6 2 12 8 18"></polyline>
                        </svg>
                    </div>
                    <span>Big-O</span>
                </a>

                <div class="hidden md:flex items-center space-x-1">
                    <template x-if="user && user.username">
                        <a href="index.html" class="lc-nav-link">Dashboard</a>
                    </template>
                    <a href="problems.html" class="lc-nav-link">Problems</a>
                    <a href="leaderboard.html" class="lc-nav-link">Leaderboard</a>
                    <a href="contact.html" class="lc-nav-link active">Contact Us</a>
                    <template x-if="user && user.role === 'faculty'">
                        <a href="faculty.html" class="lc-nav-link text-[#10b981]">Faculty</a>
                    </template>
                    <template x-if="user && user.role === 'admin'">
                        <a href="admin.html" class="lc-nav-link text-[#ff375f]">Admin</a>
                    </template>
                </div>
            </div>

            <!-- Right: Theme Switch & Actions -->
            <div class="flex items-center space-x-3">
                <!-- Theme Switch -->
                <div class="relative" x-data="{ open: false, current: localStorage.getItem('theme') || 'dark', setTheme(t) { this.current = t; const h = document.documentElement; h.classList.remove('dark'); if (t === 'dark') h.classList.add('dark'); localStorage.setItem('theme', t); this.open = false; } }" @keydown.escape.window="open = false">
                    <button @click="open = !open" class="p-1.5 rounded-md bg-[#323232] hover:bg-[#3e3e3e] border border-[rgba(255,255,255,0.08)] text-[#9ca3af] hover:text-[#eff1f6] transition-colors" title="Theme">
                        <svg x-show="current === 'dark'" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
                        <svg x-show="current === 'light'" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
                    </button>
                    <div x-show="open" @click.outside="open = false" x-transition class="absolute right-0 mt-2 w-32 bg-[#282828] border border-[rgba(255,255,255,0.1)] rounded-lg shadow-2xl z-50 py-1 text-xs">
                        <button @click="setTheme('dark')" class="w-full flex items-center gap-2 px-3 py-2 text-[#9ca3af] hover:text-[#eff1f6] hover:bg-[#373737]" :class="current === 'dark' ? 'font-semibold text-[#ffa116]' : ''">Dark</button>
                        <button @click="setTheme('light')" class="w-full flex items-center gap-2 px-3 py-2 text-[#9ca3af] hover:text-[#eff1f6] hover:bg-[#373737]" :class="current === 'light' ? 'font-semibold text-[#ffa116]' : ''">Light</button>
                    </div>
                </div>

                <!-- User / Auth Actions -->
                <template x-if="user && user.username">
                    <div class="flex items-center space-x-3">
                        <a href="profile.html" class="flex items-center gap-2 hover:opacity-90 transition-opacity">
                            <template x-if="profile && profile.avatar_url">
                                <img :src="API_BASE_URL.replace('/api', '') + profile.avatar_url" alt="Profile" class="w-7 h-7 rounded-full object-cover border border-[rgba(255,255,255,0.15)]">
                            </template>
                            <template x-if="!profile || !profile.avatar_url">
                                <div class="w-7 h-7 rounded-full bg-[#ffa116] flex items-center justify-center text-[#1a1a1a] font-bold text-xs" x-text="user.username ? user.username.charAt(0).toUpperCase() : '?'"></div>
                            </template>
                            <span class="text-sm font-semibold text-[#eff1f6] hidden sm:inline" x-text="user.username"></span>
                        </a>
                        <button @click="Auth.logout()" class="lc-btn-signout">Sign Out</button>
                    </div>
                </template>
                <template x-if="!user || !user.username">
                    <div class="flex items-center space-x-2">
                        <a href="landing.html?login" class="lc-btn-signin">Sign In</a>
                        <a href="landing.html?register" class="lc-btn-register">Register</a>
                    </div>
                </template>
            </div>
        </div>
    </nav>


    <!-- Main -->
    <main class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1">

        <!-- Page header -->
        <div class="mb-6">
            <h1 class="text-2xl font-bold text-[#eff1f6] tracking-tight">Contact Us</h1>
            <p class="text-[#8a8a8e] mt-1.5 text-sm">Report a bug, request a feature, ask a question, or reach out to the admin — we read every message.</p>
        </div>

        <!-- Success banner -->
        <div x-show="successMsg" x-transition class="mb-6 flex items-center gap-3 bg-[#2cbb5d]/10 border border-[#2cbb5d]/30 text-[#2cbb5d] rounded-lg px-4 py-3">
            <svg class="w-5 h-5 text-[#2cbb5d] shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
            <p class="text-sm font-medium" x-text="successMsg"></p>
        </div>

        <!-- Error banner -->
        <div x-show="errorMsg" x-transition class="mb-6 flex items-center gap-3 bg-[#ff375f]/10 border border-[#ff375f]/30 text-[#ff375f] rounded-lg px-4 py-3">
            <svg class="w-5 h-5 text-[#ff375f] shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
            <p class="text-sm font-medium" x-text="errorMsg"></p>
        </div>

        <!-- Contact form -->
        <div class="bg-[#282828] border border-[rgba(255,255,255,0.08)] rounded-xl p-6 sm:p-8 mb-8 shadow-sm">
            <h2 class="text-base font-bold text-[#eff1f6] mb-5 flex items-center gap-2">
                <svg class="w-4 h-4 text-[#ffa116]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
                Send a Message
            </h2>
            <form @submit.prevent="submitForm">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="block text-xs font-medium text-[#8a8a8e] uppercase tracking-wider mb-1.5">Your Name</label>
                        <input type="text" x-model="form.sender_name" required placeholder="Full name"
                               class="w-full bg-[#323232] border border-[rgba(255,255,255,0.08)] rounded-lg py-2 px-3 text-sm text-[#eff1f6] placeholder-[#8a8a8e] focus:outline-none focus:border-[#ffa116] focus:ring-1 focus:ring-[#ffa116] transition">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-[#8a8a8e] uppercase tracking-wider mb-1.5">Email</label>
                        <input type="email" x-model="form.sender_email" required placeholder="you@example.com"
                               class="w-full bg-[#323232] border border-[rgba(255,255,255,0.08)] rounded-lg py-2 px-3 text-sm text-[#eff1f6] placeholder-[#8a8a8e] focus:outline-none focus:border-[#ffa116] focus:ring-1 focus:ring-[#ffa116] transition">
                    </div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="block text-xs font-medium text-[#8a8a8e] uppercase tracking-wider mb-1.5">Category</label>
                        <select x-model="form.category"
                                class="w-full bg-[#323232] border border-[rgba(255,255,255,0.08)] rounded-lg py-2 px-3 text-sm text-[#eff1f6] focus:outline-none focus:border-[#ffa116] focus:ring-1 focus:ring-[#ffa116] transition">
                            <option value="bug">Bug Report</option>
                            <option value="suggestion">Feature / Change Request</option>
                            <option value="question">Question</option>
                            <option value="content">Content Issue</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-[#8a8a8e] uppercase tracking-wider mb-1.5">Subject</label>
                        <input type="text" x-model="form.subject" required placeholder="Brief subject line"
                               class="w-full bg-[#323232] border border-[rgba(255,255,255,0.08)] rounded-lg py-2 px-3 text-sm text-[#eff1f6] placeholder-[#8a8a8e] focus:outline-none focus:border-[#ffa116] focus:ring-1 focus:ring-[#ffa116] transition">
                    </div>
                </div>
                <div class="mb-5">
                    <label class="block text-xs font-medium text-[#8a8a8e] uppercase tracking-wider mb-1.5">Message</label>
                    <textarea x-model="form.message" rows="5" required placeholder="Describe your issue, request, or question in detail..."
                              class="w-full bg-[#323232] border border-[rgba(255,255,255,0.08)] rounded-lg py-2.5 px-3 text-sm text-[#eff1f6] placeholder-[#8a8a8e] focus:outline-none focus:border-[#ffa116] focus:ring-1 focus:ring-[#ffa116] resize-none transition"></textarea>
                </div>
                <div class="flex justify-end">
                    <button type="submit" :disabled="submitting"
                            class="bg-[#ffa116] hover:bg-[#ffb340] text-[#1a1a1a] font-semibold text-sm px-5 py-2.5 rounded-lg transition-all flex items-center gap-2 disabled:opacity-50 cursor-pointer shadow-sm">
                        <svg x-show="!submitting" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>
                        <svg x-show="submitting" class="w-4 h-4 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                        <span x-text="submitting ? 'Sending…' : 'Send Message'"></span>
                    </button>
                </div>
            </form>
        </div>

        <!-- My Previous Messages -->
        <template x-if="user">
            <div>
                <h2 class="text-base font-bold text-[#eff1f6] mb-4 flex items-center gap-2">
                    <svg class="w-4 h-4 text-[#8a8a8e]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-3 3-3-3z"/></svg>
                    My Previous Messages
                </h2>
                <template x-if="loadingMine">
                    <div class="text-center py-8 text-[#8a8a8e] text-sm">Loading your messages…</div>
                </template>
                <template x-if="!loadingMine && myMessages.length === 0">
                    <div class="bg-[#282828] border border-[rgba(255,255,255,0.08)] rounded-xl p-8 text-center text-[#8a8a8e] text-sm">
                        You haven't sent any messages yet.
                    </div>
                </template>
                <div class="space-y-3">
                    <template x-for="msg in myMessages" :key="msg.id">
                        <div class="bg-[#282828] border border-[rgba(255,255,255,0.08)] rounded-xl overflow-hidden">
                            <!-- Message header -->
                            <div class="flex items-start justify-between gap-3 px-5 py-3.5 border-b border-[rgba(255,255,255,0.06)] bg-[#2e2e2e]/50">
                                <div class="flex-1 min-w-0">
                                    <p class="font-semibold text-sm text-[#eff1f6] truncate" x-text="msg.subject"></p>
                                    <p class="text-xs text-[#8a8a8e] mt-0.5" x-text="formatDate(msg.created_at)"></p>
                                </div>
                                <div class="flex items-center gap-2 shrink-0">
                                    <span class="text-xs px-2.5 py-0.5 rounded-full font-medium capitalize"
                                          :class="{
                                              'bg-[#3a3a3a] text-[#8a8a8e]': msg.category === 'other',
                                              'bg-[#ff375f]/15 text-[#ff375f]': msg.category === 'bug',
                                              'bg-[#ffa116]/15 text-[#ffa116]': msg.category === 'suggestion',
                                              'bg-[#ffc01e]/15 text-[#ffc01e]': msg.category === 'question',
                                              'bg-[#818cf8]/15 text-[#a5b4fc]': msg.category === 'content'
                                          }"
                                          x-text="msg.category.replace('_',' ')"></span>
                                    <span class="text-xs px-2.5 py-0.5 rounded-full font-medium"
                                          :class="{
                                              'bg-[#ffc01e]/15 text-[#ffc01e]': msg.status === 'open',
                                              'bg-[#2cbb5d]/15 text-[#2cbb5d]': msg.status === 'replied',
                                              'bg-[#3a3a3a] text-[#8a8a8e]': msg.status === 'closed'
                                          }"
                                          x-text="msg.status"></span>
                                </div>
                            </div>
                            <!-- Original message -->
                            <div class="px-5 py-3.5 text-sm text-[#eff1f6]/90 whitespace-pre-wrap leading-relaxed" x-text="msg.message"></div>
                            <!-- Admin reply -->
                            <template x-if="msg.admin_reply">
                                <div class="mx-5 mb-4 bg-[#323232] border border-[rgba(255,255,255,0.08)] rounded-lg px-4 py-3">
                                    <p class="text-xs font-semibold text-[#ffa116] mb-1 flex items-center gap-1">
                                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"/></svg>
                                        Admin reply
                                        <span class="ml-1 text-[#8a8a8e] font-normal" x-text="msg.replied_at ? '· ' + formatDate(msg.replied_at) : ''"></span>
                                    </p>
                                    <p class="text-sm text-[#eff1f6] whitespace-pre-wrap leading-relaxed" x-text="msg.admin_reply"></p>
                                </div>
                            </template>
                        </div>
                    </template>
                </div>
            </div>
        </template>

    </main>
    <script>
        function contactApp() {
            return {
                user: typeof Auth !== 'undefined' ? Auth.getUser() : null,
                profile: null,
                form: {
                    sender_name: '',
                    sender_email: '',
                    category: 'other',
                    subject: '',
                    message: ''
                },
                submitting: false,
                successMsg: '',
                errorMsg: '',
                myMessages: [],
                loadingMine: false,

                init() {
                    // apply saved theme
                    const t = localStorage.getItem('theme') || 'dark';
                    if (t === 'dark') document.documentElement.classList.add('dark');
                    else document.documentElement.classList.remove('dark');

                    // try to get logged-in user (optional)
                    this.user = (typeof Auth !== 'undefined' && Auth.isAuthenticated()) ? Auth.getUser() : null;

                    // pre-fill name/email from profile if logged in
                    if (this.user) {
                        this.prefillProfile();
                        this.loadMyMessages();
                    }
                },

                async prefillProfile() {
                    try {
                        const res = await fetch(`${API_BASE_URL}/auth/profile`, { headers: Auth.getAuthHeader() });
                        if (res.ok) {
                            const p = await res.json();
                            this.profile = p;
                            this.form.sender_name  = p.username || '';
                            this.form.sender_email = p.email    || '';
                        }
                    } catch(e) {}
                },

                async loadMyMessages() {
                    this.loadingMine = true;
                    try {
                        const res = await fetch(`${API_BASE_URL}/contact/my`, { headers: Auth.getAuthHeader() });
                        if (res.ok) this.myMessages = await res.json();
                    } catch(e) { console.error(e); }
                    finally { this.loadingMine = false; }
                },

                async submitForm() {
                    this.submitting = true;
                    this.successMsg = '';
                    this.errorMsg   = '';
                    try {
                        const res = await fetch(`${API_BASE_URL}/contact`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json', ...Auth.getAuthHeader() },
                            body: JSON.stringify(this.form)
                        });
                        const data = await res.json();
                        if (res.ok) {
                            this.successMsg = data.message || 'Message sent! The admin will get back to you soon.';
                            this.form.subject = '';
                            this.form.message = '';
                            this.form.category = 'other';
                            if (this.user) this.loadMyMessages();
                        } else {
                            this.errorMsg = data.message || 'Failed to send message.';
                        }
                    } catch(e) {
                        this.errorMsg = 'Network error. Please try again.';
                    } finally {
                        this.submitting = false;
                    }
                },

                formatDate(d) {
                    if (!d) return '';
                    return new Date(d).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
                }
            }
        }
    </script>
</body>
</html>
