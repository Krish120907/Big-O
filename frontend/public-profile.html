<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile - Big-O</title>
    <!-- Tailwind CSS CDN -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" crossorigin>
    <link rel="stylesheet" href="assets/css/tailwind.min.css">
    <link rel="stylesheet" href="assets/css/styles.css?v=15">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              lc: {
                bg: '#1a1a1a',
                surface: '#282828',
                elevated: '#323232',
                hover: '#373737',
                border: 'rgba(255, 255, 255, 0.08)',
                brand: '#ffa116',
                easy: '#00b8a3',
                medium: '#ffc01e',
                hard: '#ff375f',
                submit: '#2cbb5d'
              }
            }
          }
        }
      }
    </script>
    <script>
      window.__ENV__ = {
        API_BASE_URL: "http://localhost:8080/api"
      };
    </script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/auth.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-[#1a1a1a] text-[#eff1f6] min-h-screen flex flex-col font-sans transition-colors duration-150" x-data="publicProfileApp()" x-init="init()">
    
    <!-- Top LeetCode Navigation Bar -->
    <nav class="lc-navbar">
        <div class="lc-navbar-inner">
            <!-- Left: Logo & Nav Links -->
            <div class="flex items-center space-x-6">
                <a href="index.html" class="lc-brand">
                    <div class="lc-brand-icon">
                        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="16 18 22 12 16 6"></polyline>
                            <polyline points="8 6 2 12 8 18"></polyline>
                        </svg>
                    </div>
                    <span>Big-O</span>
                </a>

                <div class="hidden md:flex items-center space-x-1">
                    <template x-if="user && user.username">
                        <a href="index.html" class="lc-nav-link">Dashboard</a>
                    </template>
                    <a href="problems.html" class="lc-nav-link">Problems</a>
                    <a href="leaderboard.html" class="lc-nav-link active">Leaderboard</a>
                </div>
            </div>

            <!-- Right: User Actions -->
            <div class="flex items-center space-x-3">

                <template x-if="user && user.username">
                    <a href="profile.html" class="lc-btn-signin text-xs py-1.5 px-3">My Profile</a>
                </template>
                <template x-if="!user || !user.username">
                    <div class="flex items-center space-x-2">
                        <a href="landing.html?login" class="lc-btn-signin">Sign In</a>
                        <a href="landing.html?register" class="lc-btn-register">Register</a>
                    </div>
                </template>
            </div>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full">
        <template x-if="loading">
            <div class="text-center py-12">
                <div class="inline-block">
                    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-[#ffa116]"></div>
                </div>
                <p class="mt-4 text-xs text-[var(--text-muted)]">Loading profile...</p>
            </div>
        </template>

        <template x-if="!loading && profile">
            <div>
                <!-- User Header Card (LeetCode Style) -->
                <div class="bg-[var(--bg-surface)] rounded-xl border border-[var(--border)] p-8 mb-6 shadow-sm">
                    <div class="flex items-start space-x-6">
                        <!-- Avatar -->
                        <div>
                            <template x-if="profile.avatar_url">
                                <img :src="API_BASE_URL.replace('/api', '') + profile.avatar_url" :alt="profile.username" class="w-24 h-24 rounded-full object-cover border-4 border-[#ffa116]">
                            </template>
                            <template x-if="!profile.avatar_url">
                                <div class="w-24 h-24 rounded-full bg-[#ffa116] flex items-center justify-center text-[#1a1a1a] text-4xl font-bold" x-text="profile.username.charAt(0).toUpperCase()"></div>
                            </template>
                        </div>

                        <!-- User Info -->
                        <div class="flex-1">
                            <h1 class="text-3xl font-bold text-[var(--text)] mb-2" x-text="profile.username"></h1>
                            
                            <div class="grid grid-cols-2 gap-4 mt-4">
                                <div>
                                    <p class="text-xs font-semibold text-[var(--text-muted)] uppercase tracking-wider">Current Streak</p>
                                    <p class="text-xl font-bold text-[#ffa116]" x-text="profile.streak_count + ' days 🔥'"></p>
                                </div>
                                <div>
                                    <p class="text-xs font-semibold text-[var(--text-muted)] uppercase tracking-wider">Member Since</p>
                                    <p class="text-sm font-semibold text-[var(--text-secondary)]" x-text="formatDate(profile.created_at)"></p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Stats (LeetCode Style) -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                    <div class="bg-[var(--bg-surface)] rounded-xl border border-[var(--border)] p-6 shadow-sm">
                        <p class="text-xs font-semibold text-[var(--text-muted)] uppercase tracking-wider mb-2">Total Problems Solved</p>
                        <p class="text-3xl font-bold font-mono text-[#00b8a3]" x-text="stats.solved_count || 0"></p>
                    </div>
                    <div class="bg-[var(--bg-surface)] rounded-xl border border-[var(--border)] p-6 shadow-sm">
                        <p class="text-xs font-semibold text-[var(--text-muted)] uppercase tracking-wider mb-2">Current Streak</p>
                        <p class="text-3xl font-bold font-mono text-[#ffa116]" x-text="profile.streak_count + ' 🔥'"></p>
                    </div>
                    <div class="bg-[var(--bg-surface)] rounded-xl border border-[var(--border)] p-6 shadow-sm">
                        <p class="text-xs font-semibold text-[var(--text-muted)] uppercase tracking-wider mb-2">Accuracy Rate</p>
                        <p class="text-3xl font-bold font-mono text-[#2cbb5d]" x-text="stats.accuracy + '%'"></p>
                    </div>
                </div>

                <!-- Problems Solved Section -->
                <div class="bg-[var(--bg-surface)] rounded-xl border border-[var(--border)] overflow-hidden shadow-sm">
                    <div class="p-6 border-b border-[var(--border)]">
                        <h2 class="text-lg font-bold text-[var(--text)]">Problems Solved</h2>
                    </div>
                    
                    <template x-if="solvedProblems.length > 0">
                        <div class="overflow-x-auto">
                            <table class="w-full text-left text-xs border-collapse">
                                <thead>
                                    <tr class="border-b border-[var(--border)] bg-[var(--bg-surface)] text-[var(--text-secondary)] font-semibold uppercase tracking-wider text-[11px]">
                                        <th class="py-3 px-6">Problem</th>
                                        <th class="py-3 px-6 w-32">Difficulty</th>
                                        <th class="py-3 px-6 w-40 text-right">Solved On</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-[var(--border)]">
                                    <template x-for="problem in solvedProblems" :key="problem.id">
                                        <tr class="hover:bg-[var(--bg-hover)] transition-colors">
                                            <td class="py-3.5 px-6 font-medium">
                                                <a :href="'problem.html?id=' + problem.problem_id" class="text-[var(--text)] hover:text-[#ffa116] transition-colors" x-text="problem.problem_title"></a>
                                            </td>
                                            <td class="py-3.5 px-6">
                                                <span :class="problem.difficulty === 'Easy' ? 'lc-badge-easy' : (problem.difficulty === 'Medium' ? 'lc-badge-medium' : 'lc-badge-hard')" x-text="problem.difficulty"></span>
                                            </td>
                                            <td class="py-3.5 px-6 text-right font-mono text-[var(--text-muted)]" x-text="formatDate(problem.created_at)"></td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </template>

                    <template x-if="solvedProblems.length === 0">
                        <p class="text-[var(--text-muted)] text-center py-12 text-xs">No problems solved yet.</p>
                    </template>
                </div>
            </div>
        </template>

        <template x-if="!loading && error">
            <div class="bg-[var(--danger-soft)] border border-[#ff375f]/30 rounded-xl p-6 text-center">
                <p class="text-[#ff375f] font-semibold text-sm" x-text="error"></p>
                <a href="leaderboard.html" class="mt-4 inline-block text-xs text-[#ffa116] hover:underline font-medium">Back to Leaderboard</a>
            </div>
        </template>
    </main>

    <script src="assets/js/app.js"></script>
    <script src="assets/js/auth.js"></script>
    <script>
        function publicProfileApp() {
            return {
                user: typeof Auth !== 'undefined' ? Auth.getUser() : null,
                profile: null,
                solvedProblems: [],
                stats: {
                    solved_count: 0,
                    accuracy: 0,
                    total_submissions: 0
                },
                loading: true,
                error: null,

                async init() {
                    this.user = Auth.getUser();
                    // Get userId from URL query param
                    const params = new URLSearchParams(window.location.search);
                    const userId = params.get('id');

                    if (!userId) {
                        this.error = 'User ID not provided';
                        this.loading = false;
                        return;
                    }

                    try {
                        // Fetch public profile
                        console.log('Fetching profile for userId:', userId);
                        const profileRes = await fetch(`${API_BASE_URL}/users/${userId}/profile`);
                        console.log('Profile response status:', profileRes.status);
                        console.log('Profile response ok:', profileRes.ok);
                        
                        const profileText = await profileRes.text();
                        console.log('Profile response text:', profileText);
                        
                        if (!profileRes.ok) throw new Error('User not found - Status: ' + profileRes.status);
                        
                        this.profile = JSON.parse(profileText);
                        console.log('Profile data:', this.profile);

                        // Fetch user's stats
                        const statsRes = await fetch(`${API_BASE_URL}/users/${userId}/stats`);
                        if (statsRes.ok) {
                            this.stats = await statsRes.json();
                            console.log('Stats:', this.stats);
                        }

                        // Fetch user's solved problems
                        const submissionsRes = await fetch(`${API_BASE_URL}/users/${userId}/submissions`);
                        if (submissionsRes.ok) {
                            this.solvedProblems = await submissionsRes.json();
                            console.log('Solved problems:', this.solvedProblems);
                        }

                        this.loading = false;
                    } catch (err) {
                        console.error('Error details:', err);
                        this.error = err.message || 'Failed to load profile';
                        this.loading = false;
                    }
                },                
                formatDate(dateString) {
                    if (!dateString) return 'N/A';
                    try {
                        // Handle both ISO format and other formats
                        const date = new Date(dateString);
                        if (isNaN(date.getTime())) {
                            return 'N/A';
                        }
                        return date.toLocaleDateString('en-US', { 
                            year: 'numeric', 
                            month: 'short', 
                            day: 'numeric' 
                        });
                    } catch (e) {
                        console.error('Error formatting date:', dateString, e);
                        return 'N/A';
                    }
                },

                getDifficultyColor(difficulty) {
                    const colors = {
                        'Easy': 'bg-[#00b8a3]/15 text-[#00b8a3]',
                        'Medium': 'bg-[#ffc01e]/15 text-[#ffc01e]',
                        'Hard': 'bg-[#ff375f]/15 text-[#ff375f]'
                    };
                    return colors[difficulty] || 'bg-[#323232] text-[#9ca3af]';
                }
            }
        }
    </script>
</body>
</html>
