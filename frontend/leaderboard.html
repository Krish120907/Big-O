<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard - Big-O</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" crossorigin>
    <link rel="stylesheet" href="assets/css/tailwind.min.css">
    <link rel="stylesheet" href="assets/css/styles.css?v=10">
    <script>
      window.__ENV__ = {
        API_BASE_URL: "http://localhost:8080/api"
      };
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-[var(--bg)] text-[var(--text)] min-h-screen flex flex-col font-sans transition-colors duration-150" x-data="leaderboardApp()" x-init="init()">
    
    <!-- Top LeetCode Navigation Bar -->
    <nav class="h-14 bg-[var(--bg-surface)] border-b border-[var(--border)] sticky top-0 z-50 shrink-0">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-full flex items-center justify-between">
            <!-- Left: Logo & Nav Links -->
            <div class="flex items-center space-x-8">
                <a href="index.html" class="flex items-center gap-2 shrink-0 group">
                    <div class="w-8 h-8 rounded-lg bg-[#ffa116] flex items-center justify-center text-[#1a1a1a] shadow-sm">
                        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="16 18 22 12 16 6"></polyline>
                            <polyline points="8 6 2 12 8 18"></polyline>
                        </svg>
                    </div>
                    <span class="text-lg font-bold tracking-tight text-[var(--text)]">Big-O</span>
                </a>

                <div class="hidden md:flex items-center space-x-1">
                    <a href="index.html" class="px-3 py-1.5 rounded-md text-sm font-medium text-[var(--text-secondary)] hover:text-[var(--text)] hover:bg-[var(--bg-hover)] transition-colors">Dashboard</a>
                    <a href="problems.html" class="px-3 py-1.5 rounded-md text-sm font-medium text-[var(--text-secondary)] hover:text-[var(--text)] hover:bg-[var(--bg-hover)] transition-colors">Problems</a>
                    <a href="leaderboard.html" class="px-3 py-1.5 rounded-md text-sm font-semibold text-[var(--text)] border-b-2 border-[#ffa116]">Leaderboard</a>
                    
                    <template x-if="user && user.role === 'faculty'">
                        <a href="faculty.html" class="px-3 py-1.5 rounded-md text-sm font-medium text-[#10b981] hover:bg-[#10b981]/10 transition-colors">Faculty</a>
                    </template>
                    <template x-if="user && user.role === 'admin'">
                        <a href="admin.html" class="px-3 py-1.5 rounded-md text-sm font-medium text-[#ff375f] hover:bg-[#ff375f]/10 transition-colors">Admin</a>
                    </template>
                </div>
            </div>

            <!-- Right: Theme, User Profile & Sign Out -->
            <div class="flex items-center space-x-3">
                <!-- Theme Switch -->
                <div class="relative" x-data="{ open: false, current: localStorage.getItem('theme') || 'dark', setTheme(t) { this.current = t; const h = document.documentElement; h.classList.remove('dark'); if (t === 'dark') h.classList.add('dark'); localStorage.setItem('theme', t); this.open = false; } }" @keydown.escape.window="open = false">
                    <button @click="open = !open" class="p-2 rounded-lg bg-[var(--bg-elevated)] border border-[var(--border)] text-[var(--text-secondary)] hover:text-[var(--text)] transition-colors" title="Theme">
                        <svg x-show="current === 'dark'" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
                        <svg x-show="current === 'light'" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
                    </button>
                    <div x-show="open" @click.outside="open = false" x-transition class="absolute right-0 mt-2 w-36 bg-[var(--bg-surface)] border border-[var(--border)] rounded-lg shadow-xl z-50 py-1 text-xs">
                        <button @click="setTheme('dark')" class="w-full flex items-center gap-2 px-3 py-2 text-[var(--text-secondary)] hover:text-[var(--text)] hover:bg-[var(--bg-hover)]" :class="current === 'dark' ? 'font-semibold text-[#ffa116]' : ''">Dark</button>
                        <button @click="setTheme('light')" class="w-full flex items-center gap-2 px-3 py-2 text-[var(--text-secondary)] hover:text-[var(--text)] hover:bg-[var(--bg-hover)]" :class="current === 'light' ? 'font-semibold text-[#ffa116]' : ''">Light</button>
                    </div>
                </div>

                <a href="profile.html" class="flex items-center gap-2 hover:opacity-90 transition-opacity">
                    <template x-if="profile && profile.avatar_url">
                        <img :src="API_BASE_URL.replace('/api', '') + profile.avatar_url" alt="Profile" class="w-8 h-8 rounded-full object-cover border border-[var(--border)]">
                    </template>
                    <template x-if="!profile || !profile.avatar_url">
                        <div class="w-8 h-8 rounded-full bg-[#ffa116] flex items-center justify-center text-[#1a1a1a] font-bold text-xs" x-text="user ? user.username.charAt(0).toUpperCase() : '?'"></div>
                    </template>
                    <span class="text-sm font-semibold text-[var(--text)] hidden sm:inline" x-text="user ? user.username : ''"></span>
                </a>

                <button @click="Auth.logout()" class="text-xs bg-[var(--bg-elevated)] hover:bg-[var(--danger-soft)] text-[var(--text-secondary)] hover:text-[var(--danger)] border border-[var(--border)] px-3 py-1.5 rounded-lg font-medium transition-colors">Sign Out</button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full">
        
        <!-- Header Banner -->
        <div class="bg-[var(--bg-surface)] border border-[var(--border)] rounded-xl p-6 mb-8 flex flex-col md:flex-row items-start md:items-center justify-between gap-4 shadow-sm">
            <div>
                <h1 class="text-2xl font-bold tracking-tight text-[var(--text)] flex items-center gap-2">
                    <span>Global Ranking</span>
                    <span class="text-sm px-2 py-0.5 rounded-full bg-[#ffa116]/15 text-[#ffa116] font-semibold">Live</span>
                </h1>
                <p class="text-sm text-[var(--text-secondary)] mt-1">See top performers ranked by problem solves and coding consistency.</p>
            </div>
            <div>
                <a href="problems.html" class="lc-btn-submit text-xs py-2 px-4 shadow-sm">
                    Solve to Rank Up
                </a>
            </div>
        </div>

        <!-- Leaderboard Table (LeetCode Style) -->
        <div class="bg-[var(--bg-surface)] border border-[var(--border)] rounded-xl overflow-hidden shadow-sm">
            <table class="w-full text-left text-xs border-collapse">
                <thead>
                    <tr class="border-b border-[var(--border)] bg-[var(--bg-surface)] text-[var(--text-secondary)] font-semibold uppercase tracking-wider text-[11px]">
                        <th class="py-3.5 px-6 w-24 text-center">Rank</th>
                        <th class="py-3.5 px-6">User</th>
                        <th class="py-3.5 px-6 w-40">Streak</th>
                        <th class="py-3.5 px-6 w-40 text-right">Solved</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-[var(--border)]">
                    <template x-for="(row, idx) in leaderboard" :key="row.id">
                        <tr class="hover:bg-[var(--bg-hover)] transition-colors"
                            :class="user && user.id === row.id ? 'bg-[#ffa116]/5 border-l-2 border-l-[#ffa116]' : ''">
                            <!-- Rank Column -->
                            <td class="py-3.5 px-6 text-center font-bold">
                                <template x-if="idx === 0">
                                    <span class="inline-flex items-center justify-center w-7 h-7 rounded-full bg-[#ffa116] text-[#1a1a1a] shadow-sm font-extrabold text-xs">1</span>
                                </template>
                                <template x-if="idx === 1">
                                    <span class="inline-flex items-center justify-center w-7 h-7 rounded-full bg-[#9ca3af] text-[#1a1a1a] shadow-sm font-extrabold text-xs">2</span>
                                </template>
                                <template x-if="idx === 2">
                                    <span class="inline-flex items-center justify-center w-7 h-7 rounded-full bg-[#d97706] text-white shadow-sm font-extrabold text-xs">3</span>
                                </template>
                                <template x-if="idx > 2">
                                    <span class="text-[var(--text-muted)] font-mono" x-text="idx + 1"></span>
                                </template>
                            </td>

                            <!-- User Info -->
                            <td class="py-3.5 px-6">
                                <a :href="'public-profile.html?id=' + row.id" class="flex items-center gap-3 group">
                                    <template x-if="row.avatar_url">
                                        <img :src="API_BASE_URL.replace('/api', '') + row.avatar_url" class="w-8 h-8 rounded-full object-cover border border-[var(--border)]">
                                    </template>
                                    <template x-if="!row.avatar_url">
                                        <div class="w-8 h-8 rounded-full bg-[var(--bg-elevated)] text-[var(--text)] flex items-center justify-center font-bold text-xs" x-text="row.username.charAt(0).toUpperCase()"></div>
                                    </template>
                                    <div>
                                        <div class="font-semibold text-sm text-[var(--text)] group-hover:text-[#ffa116] transition-colors" x-text="row.username"></div>
                                        <div class="text-[11px] text-[var(--text-muted)]" x-show="user && user.id === row.id">(You)</div>
                                    </div>
                                </a>
                            </td>

                            <!-- Streak -->
                            <td class="py-3.5 px-6">
                                <span class="inline-flex items-center gap-1 font-mono text-xs text-[#ffa116] bg-[#ffa116]/10 px-2.5 py-1 rounded-md font-semibold">
                                    🔥 <span x-text="`${row.streak_count || 0} days`"></span>
                                </span>
                            </td>

                            <!-- Solved Problems -->
                            <td class="py-3.5 px-6 text-right">
                                <span class="font-mono font-bold text-sm text-[#00b8a3]" x-text="row.solved_count || 0"></span>
                            </td>
                        </tr>
                    </template>
                    <template x-if="leaderboard.length === 0">
                        <tr>
                            <td colspan="4" class="py-12 text-center text-xs text-[var(--text-muted)]">
                                No participants on the leaderboard yet. Solve questions to take the lead!
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>

    </main>

    <script src="assets/js/app.js"></script>
    <script src="assets/js/auth.js"></script>
    <script>
        function leaderboardApp() {
            return {
                user: null,
                profile: null,
                leaderboard: [],

                init() {
                    Auth.checkAuthGuard();
                    this.user = Auth.getUser();
                    this.fetchProfile();
                    this.fetchLeaderboard();
                },

                async fetchProfile() {
                    try {
                        const response = await fetch(`${API_BASE_URL}/auth/profile`, {
                            headers: Auth.getAuthHeader()
                        });
                        if (response.ok) {
                            this.profile = await response.json();
                            if (this.user) {
                                this.user.username = this.profile.username;
                            }
                        }
                    } catch (e) {
                        console.error('Error fetching profile', e);
                    }
                },

                async fetchLeaderboard() {
                    try {
                        const response = await fetch(`${API_BASE_URL}/leaderboard`, {
                            headers: Auth.getAuthHeader()
                        });
                        if (response.ok) {
                            this.leaderboard = await response.json();
                        }
                    } catch (e) {
                        console.error('Error fetching leaderboard', e);
                    }
                }
            }
        }
    </script>
</body>
</html>
