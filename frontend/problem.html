<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Problem Workspace - Big-O</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" crossorigin>
    <link rel="stylesheet" href="assets/css/tailwind.min.css">
    <link rel="stylesheet" href="assets/css/styles.css?v=15">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              lc: {
                bg: '#1a1a1a',
                surface: '#282828',
                elevated: '#323232',
                hover: '#373737',
                border: 'rgba(255, 255, 255, 0.08)',
                brand: '#ffa116',
                easy: '#00b8a3',
                medium: '#ffc01e',
                hard: '#ff375f',
                submit: '#2cbb5d'
              }
            }
          }
        }
      }
    </script>
    <script>
      window.__ENV__ = {
        API_BASE_URL: "http://localhost:8080/api"
      };
    </script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/auth.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Monaco Editor AMD Loader -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/require.js/2.3.6/require.min.js"></script>
</head>
<body class="bg-[#1a1a1a] text-[#eff1f6] min-h-screen flex flex-col font-sans transition-colors duration-150 select-none overflow-hidden" x-data="workspaceApp()" x-init="init()">
    
    <!-- Top LeetCode Workspace Bar -->
    <header class="h-12 bg-[#282828] border-b border-[rgba(255,255,255,0.08)] flex items-center justify-between px-4 z-50 shrink-0">
        <!-- Left: Logo & Problem Title Navigation -->
        <div class="flex items-center space-x-3 min-w-0">
            <!-- Brand Logo -->
            <a href="problems.html" class="flex items-center gap-2 shrink-0 group">
                <div class="w-7 h-7 rounded-md bg-[#ffa116] flex items-center justify-center text-[#1a1a1a] shadow-sm">
                    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="16 18 22 12 16 6"></polyline>
                        <polyline points="8 6 2 12 8 18"></polyline>
                    </svg>
                </div>
                <span class="text-base font-bold tracking-tight text-[var(--text)] hidden sm:inline">Big-O</span>
            </a>

            <div class="h-4 w-px bg-[var(--border)] mx-1"></div>

            <!-- Problem List Link -->
            <a href="problems.html" class="flex items-center gap-1.5 px-2.5 py-1 rounded-md text-xs font-medium text-[var(--text-secondary)] hover:text-[var(--text)] hover:bg-[var(--bg-hover)] transition-colors" title="Problem List">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h7"></path>
                </svg>
                <span class="hidden md:inline">Problem List</span>
            </a>

            <!-- Problem Navigation Prev/Next -->
            <div class="flex items-center text-[var(--text-secondary)]">
                <button @click="navigateProblem(-1)" class="p-1 rounded hover:bg-[var(--bg-hover)] hover:text-[var(--text)] transition-colors" title="Previous Question">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
                </button>
                <button @click="navigateProblem(1)" class="p-1 rounded hover:bg-[var(--bg-hover)] hover:text-[var(--text)] transition-colors" title="Next Question">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                </button>
            </div>

            <div class="h-4 w-px bg-[var(--border)] mx-1 hidden sm:block"></div>

            <!-- Problem Title & Badge -->
            <div class="flex items-center space-x-2 truncate">
                <span class="text-sm font-semibold text-[var(--text)] truncate" x-text="`${problem.id ? problem.id + '.' : ''} ${problem.title || 'Loading...'}`"></span>
                <template x-if="problem.difficulty">
                    <span :class="problem.difficulty === 'Easy' ? 'lc-badge-easy' : (problem.difficulty === 'Medium' ? 'lc-badge-medium' : 'lc-badge-hard')"
                          x-text="problem.difficulty"></span>
                </template>
            </div>
        </div>

        <!-- Center: Action Buttons (Run & Submit) -->
        <div class="flex items-center space-x-2">
            <!-- Run Button -->
            <button @click="runCode()" 
                    :disabled="running"
                    class="lc-btn-run"
                    title="Run code against sample test cases (Ctrl + ')" >
                <svg class="w-3.5 h-3.5 fill-current text-[var(--text-secondary)]" viewBox="0 0 24 24">
                    <polygon points="5 3 19 12 5 21 5 3"></polygon>
                </svg>
                <span class="font-medium">Run</span>
            </button>

            <!-- Submit Button -->
            <button @click="submitCode()" 
                    :disabled="running"
                    class="lc-btn-submit"
                    title="Submit solution (Ctrl + Enter)">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path>
                </svg>
                <span>Submit</span>
            </button>
        </div>

        <!-- Right: Settings & User Profile -->
        <div class="flex items-center space-x-3">
            <!-- Font Size Selector -->
            <div class="flex items-center space-x-1.5 text-xs text-[var(--text-secondary)]">
                <select x-model="fontSize" @change="updateFontSize()"
                        class="bg-[var(--bg-elevated)] border border-[var(--border)] text-xs rounded px-2 py-1 text-[var(--text)] focus:outline-none focus:border-[#ffa116]">
                    <option value="12">12px</option>
                    <option value="13">13px</option>
                    <option value="14">14px</option>
                    <option value="16">16px</option>
                    <option value="18">18px</option>
                </select>
            </div>



            <!-- User Avatar & Dropdown / Sign in -->
            <template x-if="user && user.username">
                <div class="relative" x-data="{ userMenu: false }">
                    <button @click="userMenu = !userMenu" class="flex items-center gap-2 hover:opacity-90 transition-opacity">
                        <template x-if="profile && profile.avatar_url">
                            <img :src="API_BASE_URL.replace('/api', '') + profile.avatar_url" alt="Profile" class="w-7 h-7 rounded-full object-cover border border-[rgba(255,255,255,0.15)]">
                        </template>
                        <template x-if="!profile || !profile.avatar_url">
                            <div class="w-7 h-7 rounded-full bg-[#ffa116] flex items-center justify-center text-[#1a1a1a] font-bold text-xs shrink-0" x-text="user ? user.username.charAt(0).toUpperCase() : '?'"></div>
                        </template>
                    </button>
                    <div x-show="userMenu" @click.outside="userMenu = false" x-transition class="absolute right-0 mt-2 w-44 bg-[#282828] border border-[rgba(255,255,255,0.1)] rounded-lg shadow-xl z-50 py-1 text-xs">
                        <div class="px-3 py-2 border-b border-[rgba(255,255,255,0.08)]">
                            <p class="font-semibold text-[#eff1f6] truncate" x-text="user ? user.username : 'User'"></p>
                            <p class="text-[#9ca3af] truncate" x-text="user ? user.email : ''"></p>
                        </div>
                        <a href="profile.html" class="flex items-center gap-2 px-3 py-2 text-[#9ca3af] hover:text-[#eff1f6] hover:bg-[#373737]">Profile</a>
                        <a href="problems.html" class="flex items-center gap-2 px-3 py-2 text-[#9ca3af] hover:text-[#eff1f6] hover:bg-[#373737]">Problems</a>
                        <a href="leaderboard.html" class="flex items-center gap-2 px-3 py-2 text-[#9ca3af] hover:text-[#eff1f6] hover:bg-[#373737]">Leaderboard</a>
                        <div class="border-t border-[rgba(255,255,255,0.08)] my-1"></div>
                        <button @click="Auth.logout()" class="w-full text-left px-3 py-2 text-[#ff375f] hover:bg-[#ff375f]/15">Sign Out</button>
                    </div>
                </div>
            </template>
            <template x-if="!user || !user.username">
                <div class="flex items-center space-x-2">
                    <a href="landing.html?login" class="lc-btn-signin">Sign In</a>
                    <a href="landing.html?register" class="lc-btn-register">Register</a>
                </div>
            </template>
        </div>
    </header>

    <!-- Main Workspace Container: Modern LeetCode Split View -->
    <main class="flex-1 flex p-2 gap-2 overflow-hidden bg-[var(--bg)]" style="height: calc(100vh - 48px);">
        
        <!-- Left Panel: Problem Statement / Discussion -->
        <div class="w-1/2 h-full flex flex-col bg-[var(--bg-surface)] border border-[var(--border)] rounded-lg overflow-hidden shadow-sm">
            
            <!-- Tab Headers (LeetCode Style) -->
            <div class="h-10 bg-[var(--bg-surface)] border-b border-[var(--border)] px-3 flex items-center justify-between shrink-0">
                <div class="flex items-center space-x-1">
                    <button @click="activeTab = 'problem'" 
                            :class="activeTab === 'problem' ? 'active' : ''"
                            class="lc-tab">
                        <svg class="w-4 h-4 text-[#3b82f6]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                        </svg>
                        <span>Description</span>
                    </button>
                    <button @click="activeTab = 'discussion'" 
                            :class="activeTab === 'discussion' ? 'active' : ''"
                            class="lc-tab">
                        <svg class="w-4 h-4 text-[#10b981]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
                        </svg>
                        <span>Discussion</span>
                        <span x-show="comments.length > 0" class="text-[11px] px-1.5 py-0.2 rounded-full bg-[var(--bg-elevated)] text-[var(--text-secondary)]" x-text="comments.length"></span>
                    </button>
                </div>
            </div>

            <!-- Tab Content Body -->
            <div class="flex-1 overflow-y-auto p-5 select-text">
                
                <!-- Description Tab -->
                <div x-show="activeTab === 'problem'" class="space-y-6">
                    <div>
                        <h1 class="text-xl font-bold tracking-tight text-[var(--text)] mb-3" x-text="`${problem.id ? problem.id + '.' : ''} ${problem.title}`"></h1>
                        
                        <div class="flex flex-wrap items-center gap-2">
                            <!-- Difficulty Chip -->
                            <span :class="problem.difficulty === 'Easy' ? 'lc-badge-easy' : (problem.difficulty === 'Medium' ? 'lc-badge-medium' : 'lc-badge-hard')"
                                  x-text="problem.difficulty"></span>

                            <!-- Topic Tags -->
                            <template x-for="tag in (problem.topic_tags ? problem.topic_tags.split(',') : [])" :key="tag">
                                <span class="lc-tag" x-text="tag.trim()"></span>
                            </template>
                        </div>
                    </div>

                    <!-- Problem Statement -->
                    <div class="text-[13.5px] leading-relaxed text-[var(--text)] whitespace-pre-wrap font-sans" x-text="problem.description"></div>

                    <!-- Sample Examples -->
                    <div class="space-y-4 pt-2">
                        <template x-for="(sample, idx) in sampleCases" :key="sample.id">
                            <div class="space-y-1.5">
                                <h3 class="text-sm font-semibold text-[var(--text)]" x-text="`Example ${idx + 1}:`"></h3>
                                <div class="lc-example-box">
                                    <p><span class="font-bold text-[var(--text)]">Input:</span> <span class="text-[var(--text-secondary)] font-mono text-xs" x-text="sample.input"></span></p>
                                    <p class="mt-1"><span class="font-bold text-[var(--text)]">Output:</span> <span class="text-[var(--text-secondary)] font-mono text-xs" x-text="sample.expected"></span></p>
                                </div>
                            </div>
                        </template>
                    </div>

                    <!-- Constraints -->
                    <div class="space-y-2 pt-2 border-t border-[var(--border)]" x-show="problem.constraints">
                        <h3 class="text-sm font-semibold text-[var(--text)]">Constraints:</h3>
                        <div class="lc-example-box text-xs whitespace-pre-wrap" x-text="problem.constraints"></div>
                    </div>
                </div>

                <!-- Discussion Tab -->
                <div x-show="activeTab === 'discussion'" class="space-y-6">
                    <div class="flex items-center justify-between border-b border-[var(--border)] pb-3">
                        <div>
                            <h2 class="text-base font-bold text-[var(--text)]">Community Discussion</h2>
                            <p class="text-xs text-[var(--text-secondary)]">Discuss approaches, edge cases, and insights.</p>
                        </div>
                    </div>

                    <!-- Comment Composer -->
                    <div class="bg-[var(--bg-elevated)] rounded-lg p-3.5 border border-[var(--border)]">
                        <div class="flex items-start space-x-3">
                            <div class="w-7 h-7 bg-[#ffa116] rounded-full flex items-center justify-center text-[#1a1a1a] text-xs font-bold shrink-0" x-text="user ? user.username.charAt(0).toUpperCase() : '?'"></div>
                            <div class="flex-1">
                                <textarea 
                                    x-model="newComment" 
                                    placeholder="Type comment here... (Markdown supported)"
                                    class="w-full bg-[var(--bg-surface)] border border-[var(--border)] rounded-md p-2.5 text-xs text-[var(--text)] resize-none focus:outline-none focus:border-[#ffa116]"
                                    rows="3"></textarea>
                                <div class="flex items-center justify-between mt-2">
                                    <span class="text-[11px] text-[var(--text-muted)]" x-text="`${newComment.length}/2000`"></span>
                                    <button 
                                        @click="postComment()" 
                                        :disabled="!newComment.trim() || newComment.length > 2000 || postingComment"
                                        class="lc-btn-submit text-xs py-1 px-3">
                                        <span x-show="!postingComment">Post</span>
                                        <span x-show="postingComment">Posting...</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Comments List -->
                    <div class="space-y-3">
                        <template x-for="comment in comments" :key="comment.id">
                            <div class="bg-[var(--bg-surface)] border border-[var(--border)] rounded-lg p-3.5">
                                <div class="flex items-start space-x-3">
                                    <a :href="'public-profile.html?id=' + comment.user_id" class="shrink-0">
                                        <template x-if="comment.avatar_url">
                                            <img :src="API_BASE_URL.replace('/api', '') + comment.avatar_url" class="w-7 h-7 rounded-full object-cover" :alt="comment.username">
                                        </template>
                                        <template x-if="!comment.avatar_url">
                                            <div class="w-7 h-7 bg-[var(--bg-hover)] text-[var(--text)] rounded-full flex items-center justify-center text-xs font-bold" x-text="comment.username.charAt(0).toUpperCase()"></div>
                                        </template>
                                    </a>
                                    <div class="flex-1 min-w-0">
                                        <div class="flex items-center space-x-2 mb-1.5">
                                            <a :href="'public-profile.html?id=' + comment.user_id" class="font-semibold text-xs text-[var(--text)] hover:text-[#ffa116]" x-text="comment.username"></a>
                                            <template x-if="comment.role === 'faculty'">
                                                <span class="px-1.5 py-0.2 rounded text-[10px] font-bold bg-[#10b981]/20 text-[#10b981]">Faculty</span>
                                            </template>
                                            <template x-if="comment.role === 'admin'">
                                                <span class="px-1.5 py-0.2 rounded text-[10px] font-bold bg-[#ff375f]/20 text-[#ff375f]">Admin</span>
                                            </template>
                                            <span class="text-[11px] text-[var(--text-muted)]" x-text="formatDate(comment.created_at)"></span>
                                        </div>
                                        
                                        <!-- Content -->
                                        <div x-show="editingComment !== comment.id">
                                            <p class="text-xs text-[var(--text)] leading-relaxed whitespace-pre-wrap select-text" x-text="comment.content"></p>
                                        </div>

                                        <!-- Edit Comment -->
                                        <div x-show="editingComment === comment.id" class="mt-2">
                                            <textarea x-model="editContent" class="w-full bg-[var(--bg-elevated)] border border-[var(--border)] rounded p-2 text-xs" rows="3"></textarea>
                                            <div class="flex space-x-2 mt-2">
                                                <button @click="saveEdit(comment.id)" class="lc-btn-submit text-xs py-1 px-3">Save</button>
                                                <button @click="cancelEdit()" class="lc-btn-run text-xs py-1 px-3">Cancel</button>
                                            </div>
                                        </div>

                                        <!-- Actions (Vote, Reply, Delete) -->
                                        <div class="flex items-center space-x-4 mt-2.5 text-xs text-[var(--text-secondary)]">
                                            <!-- Voting -->
                                            <div class="flex items-center space-x-1">
                                                <button @click="voteComment(comment.id, 'upvote')"
                                                        :class="comment.user_vote === 'upvote' ? 'text-[#10b981]' : 'hover:text-[#10b981]'" class="p-0.5">
                                                    ▲
                                                </button>
                                                <span class="font-mono text-xs" x-text="comment.vote_score"></span>
                                                <button @click="voteComment(comment.id, 'downvote')"
                                                        :class="comment.user_vote === 'downvote' ? 'text-[#ff375f]' : 'hover:text-[#ff375f]'" class="p-0.5">
                                                    ▼
                                                </button>
                                            </div>

                                            <button @click="toggleReply(comment.id)" class="hover:text-[var(--text)]">Reply</button>

                                            <template x-if="user && user.id === comment.user_id">
                                                <div class="flex items-center space-x-2">
                                                    <button @click="startEdit(comment.id, comment.content)" class="hover:text-[var(--text)]">Edit</button>
                                                    <button @click="deleteComment(comment.id)" class="hover:text-[#ff375f]">Delete</button>
                                                </div>
                                            </template>
                                        </div>

                                        <!-- Inline Reply Box -->
                                        <div x-show="replyingTo === comment.id" class="mt-3 pl-3 border-l-2 border-[var(--border)]">
                                            <textarea x-model="replyContent" placeholder="Write a reply..." class="w-full bg-[var(--bg-elevated)] border border-[var(--border)] rounded p-2 text-xs" rows="2"></textarea>
                                            <div class="flex space-x-2 mt-1.5">
                                                <button @click="postReply()" class="lc-btn-submit text-xs py-1 px-3">Post Reply</button>
                                                <button @click="cancelReply()" class="lc-btn-run text-xs py-1 px-3">Cancel</button>
                                            </div>
                                        </div>

                                        <!-- Nested Replies -->
                                        <template x-if="comment.replies && comment.replies.length > 0">
                                            <div class="mt-3 pl-3 border-l border-[var(--border)] space-y-3">
                                                <template x-for="reply in comment.replies" :key="reply.id">
                                                    <div class="pt-2">
                                                        <div class="flex items-center space-x-2 mb-1">
                                                            <a :href="'public-profile.html?id=' + reply.user_id" class="font-semibold text-xs text-[var(--text)] hover:text-[#ffa116]" x-text="reply.username"></a>
                                                            <span class="text-[10px] text-[var(--text-muted)]" x-text="formatDate(reply.created_at)"></span>
                                                        </div>
                                                        <p class="text-xs text-[var(--text-secondary)] whitespace-pre-wrap select-text" x-text="reply.content"></p>
                                                    </div>
                                                </template>
                                            </div>
                                        </template>

                                    </div>
                                </div>
                            </div>
                        </template>

                        <div x-show="comments.length === 0" class="text-center py-8 text-xs text-[var(--text-muted)]">
                            No comments yet. Start the discussion!
                        </div>
                    </div>
                </div>

            </div>
        </div>

        <!-- Right Panel: Code Editor & Testcase Console -->
        <div class="w-1/2 h-full flex flex-col gap-2 min-w-0">
            
            <!-- Code Editor Panel -->
            <div class="flex-1 bg-[var(--bg-surface)] border border-[var(--border)] rounded-lg overflow-hidden flex flex-col min-h-0 shadow-sm">
                <!-- Editor Top Bar -->
                <div class="h-10 bg-[var(--bg-surface)] border-b border-[var(--border)] px-3 flex items-center justify-between shrink-0">
                    <div class="flex items-center space-x-2">
                        <!-- Language Selector -->
                        <div class="flex items-center gap-1.5 text-xs font-semibold px-2.5 py-1 rounded bg-[var(--bg-elevated)] border border-[var(--border)] text-[var(--text)]">
                            <span class="text-[#00b8a3]">C++</span>
                        </div>
                    </div>

                    <div class="flex items-center space-x-2">
                        <!-- Reset to Template Button -->
                        <button @click="resetTemplate()" class="p-1 rounded text-[var(--text-secondary)] hover:text-[var(--text)] hover:bg-[var(--bg-hover)] transition-colors" title="Reset Code to Default Template">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                        </button>
                    </div>
                </div>

                <!-- Monaco Container -->
                <div class="flex-1 relative w-full h-full min-h-0">
                    <div id="monaco-container" class="absolute inset-0"></div>
                </div>
            </div>

            <!-- Testcase & Test Result Panel (LeetCode Style) -->
            <div class="h-64 bg-[var(--bg-surface)] border border-[var(--border)] rounded-lg overflow-hidden flex flex-col shrink-0 shadow-sm">
                
                <!-- Console Panel Header with Tabs -->
                <div class="h-10 bg-[var(--bg-surface)] border-b border-[var(--border)] px-3 flex items-center justify-between shrink-0">
                    <div class="flex items-center space-x-1">
                        <!-- Testcase Tab -->
                        <button @click="consoleTab = 'testcase'" 
                                :class="consoleTab === 'testcase' ? 'active' : ''"
                                class="lc-tab text-xs">
                            <svg class="w-3.5 h-3.5 text-[#00b8a3]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/>
                            </svg>
                            <span>Testcase</span>
                        </button>
                        <!-- Test Result Tab -->
                        <button @click="consoleTab = 'result'" 
                                :class="consoleTab === 'result' ? 'active' : ''"
                                class="lc-tab text-xs">
                            <svg class="w-3.5 h-3.5 text-[#ffa116]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                            </svg>
                            <span>Test Result</span>
                        </button>
                    </div>

                    <!-- Compact Run/Submit in console bar -->
                    <div class="flex items-center space-x-2">
                        <button @click="runCode()" :disabled="running" class="lc-btn-run text-xs py-1 px-2.5">
                            Run
                        </button>
                        <button @click="submitCode()" :disabled="running" class="lc-btn-submit text-xs py-1 px-3">
                            Submit
                        </button>
                    </div>
                </div>

                <!-- Console Panel Body -->
                <div class="flex-1 overflow-y-auto p-4 select-text font-mono text-xs">
                    
                    <!-- 1. Testcase Tab View -->
                    <div x-show="consoleTab === 'testcase'" class="h-full flex flex-col">
                        <!-- Case Pills (Case 1, Case 2...) -->
                        <div class="flex items-center space-x-2 mb-3 shrink-0">
                            <template x-for="(sample, idx) in sampleCases" :key="sample.id">
                                <button @click="selectedCaseIdx = idx"
                                        :class="selectedCaseIdx === idx ? 'bg-[var(--bg-hover)] text-[var(--text)] font-semibold border-[var(--border)]' : 'bg-[var(--bg-elevated)] text-[var(--text-secondary)] border-transparent hover:text-[var(--text)]'"
                                        class="px-3 py-1 rounded-md text-xs border transition-colors"
                                        x-text="`Case ${idx + 1}`">
                                </button>
                            </template>
                        </div>

                        <!-- Selected Case Input & Expected Display -->
                        <template x-if="sampleCases[selectedCaseIdx]">
                            <div class="space-y-3 flex-1 overflow-y-auto">
                                <div>
                                    <div class="text-[11px] font-sans font-semibold text-[var(--text-secondary)] mb-1">Input =</div>
                                    <div class="bg-[var(--bg-elevated)] border border-[var(--border)] rounded-md p-2.5 text-[var(--text)] whitespace-pre overflow-x-auto" x-text="sampleCases[selectedCaseIdx].input"></div>
                                </div>
                                <div>
                                    <div class="text-[11px] font-sans font-semibold text-[var(--text-secondary)] mb-1">Expected Output =</div>
                                    <div class="bg-[var(--bg-elevated)] border border-[var(--border)] rounded-md p-2.5 text-[var(--text)] whitespace-pre overflow-x-auto" x-text="sampleCases[selectedCaseIdx].expected"></div>
                                </div>
                            </div>
                        </template>
                    </div>

                    <!-- 2. Test Result Tab View -->
                    <div x-show="consoleTab === 'result'" class="h-full flex flex-col">
                        <!-- Running Spinner -->
                        <div x-show="running" class="flex items-center space-x-2 text-[#ffa116] py-4">
                            <svg class="animate-spin h-4 w-4" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                            <span class="font-sans font-medium text-xs">Compiling & executing code...</span>
                        </div>

                        <!-- Result Display -->
                        <div x-show="!running">
                            <template x-if="lastRunResult">
                                <div>
                                    <!-- Status Header (Accepted / Wrong Answer / Compile Error) -->
                                    <div class="flex items-center justify-between mb-3 pb-2 border-b border-[var(--border)]">
                                        <div class="flex items-center space-x-3">
                                            <span class="text-base font-bold font-sans"
                                                  :class="lastRunResult.status === 'Accepted' ? 'text-[#2cbb5d]' : 'text-[#ff375f]'"
                                                  x-text="lastRunResult.status"></span>
                                            <span class="text-[11px] font-sans text-[var(--text-secondary)]" x-show="lastRunResult.runtime_ms !== undefined" x-text="`Runtime: ${lastRunResult.runtime_ms} ms`"></span>
                                        </div>
                                        <span class="text-[11px] font-sans text-[var(--text-muted)]" x-text="lastRunResult.isSubmission ? 'Submission' : 'Run Samples'"></span>
                                    </div>

                                    <!-- Error or Compile Error Output -->
                                    <template x-if="lastRunResult.compile_stderr">
                                        <div class="mt-2">
                                            <div class="text-[11px] font-sans text-[#ff375f] font-semibold mb-1">Compilation Details:</div>
                                            <pre class="bg-[var(--danger-soft)] border border-[#ff375f]/30 text-[#ff375f] p-3 rounded-md text-xs overflow-x-auto whitespace-pre-wrap font-mono" x-text="lastRunResult.compile_stderr"></pre>
                                        </div>
                                    </template>

                                    <!-- Test Case Pills for results -->
                                    <template x-if="lastRunResult.test_cases && lastRunResult.test_cases.length > 0">
                                        <div>
                                            <div class="flex items-center space-x-2 mb-3">
                                                <template x-for="(tc, idx) in lastRunResult.test_cases" :key="tc.id || idx">
                                                    <button @click="selectedResultIdx = idx"
                                                            :class="selectedResultIdx === idx ? 'bg-[var(--bg-hover)] text-[var(--text)] font-semibold border-[var(--border)]' : 'bg-[var(--bg-elevated)] text-[var(--text-secondary)] border-transparent hover:text-[var(--text)]'"
                                                            class="flex items-center gap-1.5 px-3 py-1 rounded-md text-xs border transition-colors">
                                                        <span :class="tc.passed ? 'text-[#2cbb5d]' : 'text-[#ff375f]'">●</span>
                                                        <span x-text="`Case ${idx + 1}`"></span>
                                                    </button>
                                                </template>
                                            </div>

                                            <!-- Selected Result Case Detail -->
                                            <template x-if="lastRunResult.test_cases[selectedResultIdx]">
                                                <div class="space-y-3 font-mono">
                                                    <div>
                                                        <div class="text-[11px] font-sans font-semibold text-[var(--text-secondary)] mb-1">Input =</div>
                                                        <div class="bg-[var(--bg-elevated)] border border-[var(--border)] rounded-md p-2.5 text-[var(--text)] whitespace-pre overflow-x-auto" x-text="lastRunResult.test_cases[selectedResultIdx].input"></div>
                                                    </div>
                                                    <div>
                                                        <div class="text-[11px] font-sans font-semibold text-[var(--text-secondary)] mb-1">Output =</div>
                                                        <div class="bg-[var(--bg-elevated)] border border-[var(--border)] rounded-md p-2.5 whitespace-pre overflow-x-auto"
                                                             :class="lastRunResult.test_cases[selectedResultIdx].passed ? 'text-[var(--text)]' : 'text-[#ff375f]'"
                                                             x-text="lastRunResult.test_cases[selectedResultIdx].actual || '[Empty Output]'"></div>
                                                    </div>
                                                    <div>
                                                        <div class="text-[11px] font-sans font-semibold text-[var(--text-secondary)] mb-1">Expected =</div>
                                                        <div class="bg-[var(--bg-elevated)] border border-[var(--border)] rounded-md p-2.5 text-[var(--text)] whitespace-pre overflow-x-auto" x-text="lastRunResult.test_cases[selectedResultIdx].expected"></div>
                                                    </div>
                                                    <template x-if="lastRunResult.test_cases[selectedResultIdx].stderr">
                                                        <div>
                                                            <div class="text-[11px] font-sans font-semibold text-[#ff375f] mb-1">Stderr:</div>
                                                            <div class="bg-[var(--danger-soft)] border border-[#ff375f]/30 rounded-md p-2.5 text-[#ff375f] whitespace-pre overflow-x-auto" x-text="lastRunResult.test_cases[selectedResultIdx].stderr"></div>
                                                        </div>
                                                    </template>
                                                </div>
                                            </template>
                                        </div>
                                    </template>
                                </div>
                            </template>

                            <template x-if="!lastRunResult && !consoleText">
                                <div class="text-[var(--text-muted)] italic py-4 font-sans text-xs">
                                    You must run your code first. Click "Run" to test with example testcases.
                                </div>
                            </template>
                            
                            <!-- Fallback raw console text if any -->
                            <div x-show="consoleText" class="mt-2 text-xs" x-html="consoleText"></div>
                        </div>
                    </div>

                </div>
            </div>

        </div>

    </main>

    <!-- Scripts -->
    <script src="assets/js/app.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/editor.js"></script>
    <script src="assets/js/runner-client.js"></script>
    <script>
        function workspaceApp() {
            return {
                user: typeof Auth !== 'undefined' ? Auth.getUser() : null,
                profile: null,
                problemId: null,
                problem: {},
                sampleCases: [],
                fontSize: '14',
                running: false,
                consoleText: '',
                activeTab: 'problem',
                consoleTab: 'testcase',
                selectedCaseIdx: 0,
                selectedResultIdx: 0,
                lastRunResult: null,
                
                // Comments functionality
                comments: [],
                newComment: '',
                postingComment: false,
                replyingTo: null,
                replyParentId: null,
                replyContent: '',
                editingComment: null,
                editContent: '',

                async init() {
                    this.user = Auth.getUser();
                    
                    const urlParams = new URLSearchParams(window.location.search);
                    this.problemId = urlParams.get('id');
                    
                    if (!this.problemId) {
                        window.location.href = 'problems.html';
                        return;
                    }

                    if (this.user) {
                        await this.fetchProfile();
                    }
                    await this.fetchProblemDetails();
                    await this.fetchSampleCases();
                    await this.fetchComments();
                    
                    // Load Monaco Code Editor
                    await initMonacoEditor('monaco-container', this.problem.default_template);

                    // Keyboard shortcuts: Ctrl+Enter to Submit, Ctrl+' to Run
                    window.addEventListener('keydown', (e) => {
                        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                            e.preventDefault();
                            this.submitCode();
                        } else if ((e.ctrlKey || e.metaKey) && e.key === "'") {
                            e.preventDefault();
                            this.runCode();
                        }
                    });
                },

                navigateProblem(delta) {
                    const currentId = parseInt(this.problemId, 10);
                    if (!isNaN(currentId)) {
                        const nextId = Math.max(1, currentId + delta);
                        window.location.href = `problem.html?id=${nextId}`;
                    }
                },

                resetTemplate() {
                    if (confirm('Reset code to default starting template?')) {
                        setEditorCode(this.problem.default_template || '');
                    }
                },

                async fetchProfile() {
                    try {
                        const response = await fetch(`${API_BASE_URL}/auth/profile`, {
                            headers: Auth.getAuthHeader()
                        });
                        if (response.ok) {
                            this.profile = await response.json();
                            if (this.user) {
                                this.user = { ...this.user, ...this.profile };
                                Auth.setUser(this.user);
                            }
                        }
                    } catch (e) {
                        console.error('Error fetching profile', e);
                    }
                },

                async fetchProblemDetails() {
                    try {
                        const response = await fetch(`${API_BASE_URL}/problems/${this.problemId}`, {
                            headers: Auth.getAuthHeader()
                        });
                        if (response.ok) {
                            this.problem = await response.json();
                        }
                    } catch (e) {
                        console.error('Error fetching problem details', e);
                    }
                },

                async fetchSampleCases() {
                    try {
                        const response = await fetch(`${API_BASE_URL}/problems/${this.problemId}/samples`, {
                            headers: Auth.getAuthHeader()
                        });
                        if (response.ok) {
                            this.sampleCases = await response.json();
                        }
                    } catch (e) {
                        console.error('Error fetching samples', e);
                    }
                },

                updateFontSize() {
                    updateEditorFontSize(parseInt(this.fontSize));
                },

                async runCode() {
                    this.running = true;
                    this.consoleText = '';
                    this.consoleTab = 'result';
                    const code = getEditorCode();

                    const tests = this.sampleCases.map(tc => ({
                        input: tc.input,
                        expected: tc.expected
                    }));

                    const res = await RunnerClient.executeLocally(code, tests, parseFloat(this.problem.time_limit_sec || 2.0));
                    this.running = false;

                    if (!res.success) {
                        this.lastRunResult = {
                            status: res.error || "Compilation Error",
                            compile_stderr: res.compile_stderr,
                            isSubmission: false,
                            test_cases: []
                        };
                        return;
                    }

                    const allPassed = res.test_cases.every(tc => tc.passed);
                    const maxRuntime = Math.max(...res.test_cases.map(tc => tc.runtime_ms || 0), 0);

                    this.lastRunResult = {
                        status: allPassed ? "Accepted" : "Wrong Answer",
                        runtime_ms: maxRuntime,
                        isSubmission: false,
                        test_cases: res.test_cases
                    };
                    this.selectedResultIdx = 0;
                },

                async submitCode() {
                    this.running = true;
                    this.consoleText = '';
                    this.consoleTab = 'result';
                    const code = getEditorCode();

                    // 1. Fetch ALL test cases from backend
                    let allTestCases = [];
                    try {
                        const response = await fetch(`${API_BASE_URL}/problems/${this.problemId}/testcases`, {
                            headers: Auth.getAuthHeader()
                        });
                        if (response.ok) {
                            allTestCases = await response.json();
                        } else {
                            throw new Error('Unauthorized or failed to fetch test cases.');
                        }
                    } catch (e) {
                        this.running = false;
                        this.lastRunResult = {
                            status: "Submission Error",
                            compile_stderr: "Could not retrieve test cases from backend server.",
                            isSubmission: true,
                            test_cases: []
                        };
                        return;
                    }

                    // 2. Execute compilation and testing locally
                    const res = await RunnerClient.executeLocally(code, allTestCases, parseFloat(this.problem.time_limit_sec || 2.0));
                    
                    if (!res.success) {
                        this.running = false;
                        this.lastRunResult = {
                            status: res.error || "Compilation Error",
                            compile_stderr: res.compile_stderr,
                            isSubmission: true,
                            test_cases: []
                        };
                        return;
                    }

                    // Calculate metrics
                    const totalCount = res.test_cases.length;
                    const passedCount = res.test_cases.filter(tc => tc.passed).length;
                    
                    let overallStatus = "Accepted";
                    let maxRuntime = 0;
                    
                    for (const tc of res.test_cases) {
                        if (!tc.passed) {
                            overallStatus = tc.status || "Wrong Answer";
                            break;
                        }
                        if (tc.runtime_ms > maxRuntime) {
                            maxRuntime = tc.runtime_ms;
                        }
                    }

                    // 3. Send final aggregated stats back to backend
                    try {
                        await RunnerClient.submitResultToBackend(
                            this.problemId,
                            overallStatus,
                            passedCount,
                            totalCount,
                            maxRuntime,
                            code
                        );
                    } catch (e) {
                        console.error('Failed to report submission to backend', e);
                    }

                    this.running = false;
                    this.lastRunResult = {
                        status: overallStatus,
                        runtime_ms: maxRuntime,
                        isSubmission: true,
                        test_cases: res.test_cases
                    };
                    this.selectedResultIdx = 0;
                },

                // Comments functionality
                async fetchComments() {
                    try {
                        const response = await fetch(`${API_BASE_URL}/comments/problem/${this.problemId}`, {
                            headers: Auth.getAuthHeader()
                        });
                        if (response.ok) {
                            this.comments = await response.json();
                        }
                    } catch (e) {
                        console.error('Error fetching comments:', e);
                    }
                },

                async postComment() {
                    if (!this.newComment.trim() || this.postingComment) return;
                    
                    this.postingComment = true;
                    try {
                        const response = await fetch(`${API_BASE_URL}/comments`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                ...Auth.getAuthHeader()
                            },
                            body: JSON.stringify({
                                problem_id: this.problemId,
                                content: this.newComment.trim()
                            })
                        });

                        if (response.ok) {
                            this.newComment = '';
                            await this.fetchComments();
                        } else {
                            const error = await response.json();
                            alert(error.message || 'Failed to post comment');
                        }
                    } catch (e) {
                        console.error('Error posting comment:', e);
                        alert('Failed to post comment');
                    } finally {
                        this.postingComment = false;
                    }
                },

                async postReply() {
                    if (!this.replyContent.trim() || !this.replyParentId) return;
                    
                    try {
                        const response = await fetch(`${API_BASE_URL}/comments`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                ...Auth.getAuthHeader()
                            },
                            body: JSON.stringify({
                                problem_id: this.problemId,
                                content: this.replyContent.trim(),
                                parent_comment_id: this.replyParentId
                            })
                        });

                        if (response.ok) {
                            this.cancelReply();
                            await this.fetchComments();
                        } else {
                            const error = await response.json();
                            alert(error.message || 'Failed to post reply');
                        }
                    } catch (e) {
                        console.error('Error posting reply:', e);
                        alert('Failed to post reply');
                    }
                },

                async voteComment(commentId, voteType) {
                    try {
                        const response = await fetch(`${API_BASE_URL}/comments/${commentId}/vote`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                ...Auth.getAuthHeader()
                            },
                            body: JSON.stringify({ vote_type: voteType })
                        });

                        if (response.ok) {
                            await this.fetchComments();
                        } else {
                            const error = await response.json();
                            alert(error.message || 'Failed to vote');
                        }
                    } catch (e) {
                        console.error('Error voting:', e);
                        alert('Failed to vote');
                    }
                },

                async deleteComment(commentId) {
                    if (!confirm('Are you sure you want to delete this comment?')) return;
                    
                    try {
                        const response = await fetch(`${API_BASE_URL}/comments/${commentId}`, {
                            method: 'DELETE',
                            headers: Auth.getAuthHeader()
                        });

                        if (response.ok) {
                            await this.fetchComments();
                        } else {
                            const error = await response.json();
                            alert(error.message || 'Failed to delete comment');
                        }
                    } catch (e) {
                        console.error('Error deleting comment:', e);
                        alert('Failed to delete comment');
                    }
                },

                startEdit(commentId, content) {
                    this.editingComment = commentId;
                    this.editContent = content;
                },

                async saveEdit(commentId) {
                    if (!this.editContent.trim()) return;
                    
                    try {
                        const response = await fetch(`${API_BASE_URL}/comments/${commentId}`, {
                            method: 'PUT',
                            headers: {
                                'Content-Type': 'application/json',
                                ...Auth.getAuthHeader()
                            },
                            body: JSON.stringify({
                                content: this.editContent.trim()
                            })
                        });

                        if (response.ok) {
                            this.cancelEdit();
                            await this.fetchComments();
                        } else {
                            const error = await response.json();
                            alert(error.message || 'Failed to update comment');
                        }
                    } catch (e) {
                        console.error('Error updating comment:', e);
                        alert('Failed to update comment');
                    }
                },

                cancelEdit() {
                    this.editingComment = null;
                    this.editContent = '';
                },

                toggleReply(commentId, mentionUsername = null, topLevelId = null) {
                    const key = commentId;
                    if (this.replyingTo === key) {
                        this.cancelReply();
                    } else {
                        this.replyingTo = key;
                        this.replyParentId = topLevelId || commentId;
                        this.replyContent = mentionUsername ? `@${mentionUsername} ` : '';
                    }
                },

                cancelReply() {
                    this.replyingTo = null;
                    this.replyParentId = null;
                    this.replyContent = '';
                }
            }
        }
    </script>
</body>
</html>
